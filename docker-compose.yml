services:
  postgres:
    image: postgres:16-alpine
    container_name: nefrohc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nefrohc
      POSTGRES_USER: nefrohc_app
      POSTGRES_PASSWORD: change_this_password
    ports:
      - "5432:5432"
    volumes:
      - nefrohc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nefrohc_app -d nefrohc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nefrohc_pgdata:
